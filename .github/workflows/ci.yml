name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'projet-app/backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd projet-app/backend
          npm ci

      - name: Build backend
        run: |
          cd projet-app/backend
          npm run build

  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'projet-app/frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd projet-app/frontend
          npm ci

      - name: Build frontend
        run: |
          cd projet-app/frontend
          npm run build
