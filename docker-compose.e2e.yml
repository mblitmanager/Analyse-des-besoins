services:
  e2e-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - e2e

  e2e-backend:
    build: ./projet-app/backend
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://e2e:e2e-only@e2e-postgres:5432/e2e
      TYPEORM_SYNCHRONIZE: "false"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: local-e2e-only-secret
      FRONTEND_URL: http://localhost:5173
      AUTO_SEND_EMAIL: "false"
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1
      MAIL_USERNAME: e2e@example.test
      MAIL_PASSWORD: e2e-only
      MAIL_ENCRYPTION: none
    ports:
      - "127.0.0.1:3003:3001"
    depends_on:
      e2e-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - e2e
      - e2e-access

networks:
  e2e:
    internal: true
  e2e-access: